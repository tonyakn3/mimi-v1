<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mimi" />
  <meta name="format-detection" content="telephone=no" />
  <title>Mimi — Phiên dịch hội thoại 2 chiều</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="mimi-card" aria-label="Mimi phiên dịch hội thoại hai chiều">
      <header class="brand">
        <div class="brand-row">
          <h1>Mimi</h1>
          <span class="brand-bubble" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
        <p>Phiên dịch hội thoại 2 chiều</p>
      </header>

      <div class="selectors">
        <label class="language-card">
          <span class="person-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img"><circle cx="24" cy="15" r="7"></circle><path d="M11 39c1.4-9 7.3-13 13-13s11.6 4 13 13"></path></svg>
          </span>
          <span class="language-copy">
            <span class="label">Người 1</span>
            <select id="lang1" aria-label="Ngôn ngữ của Người 1"></select>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </label>

        <label class="language-card second">
          <span class="person-icon violet" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img"><circle cx="24" cy="15" r="7"></circle><path d="M11 39c1.4-9 7.3-13 13-13s11.6 4 13 13"></path></svg>
          </span>
          <span class="language-copy">
            <span class="label">Người 2</span>
            <select id="lang2" aria-label="Ngôn ngữ của Người 2"></select>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </label>
      </div>

      <button id="startBtn" class="start-button" type="button" aria-label="Bắt đầu hoặc kết thúc Mimi">
        <span class="button-rings" aria-hidden="true"></span>
        <span class="mic-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64"><rect x="25" y="8" width="14" height="31" rx="7"></rect><path d="M18 31c0 9 6 15 14 15s14-6 14-15"></path><path d="M32 46v10M24 56h16"></path></svg>
        </span>
        <span class="mic-meter" aria-hidden="true"><i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i></span>
        <strong id="startLabel">BẮT ĐẦU</strong>
      </button>

      <p id="commandHint" class="command-hint">
        <span class="info-icon" aria-hidden="true">!</span>
        Người 1: <b>“Mimi nói”</b> · Người 2: <b>“dịch lại”</b>
      </p>

      <div id="status" class="status-pill" data-kind="ready" role="status" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Sẵn sàng lắng nghe</span>
      </div>

      <aside id="errorBox" class="error-box" hidden role="alert">
        <span id="errorText"></span>
        <button id="dismissError" type="button" aria-label="Đóng thông báo">×</button>
      </aside>

      <aside id="installHint" class="install-hint" hidden>
        Trên iPhone: mở bằng Safari → <b>Chia sẻ</b> → <b>Thêm vào Màn hình chính</b>.
      </aside>
    </section>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
